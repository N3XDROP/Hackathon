version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env   # 👈 aquí le decimos dónde está el .env real
    depends_on:
      - chat             # 👈 elimina si no existe “chat” o si no depende de nadie
    restart: always

  frontend:
    build: ./frontend
    ports:
      - "5173:80"

  chat:
    build: ./chat
    ports:
      - "5000:5000"
